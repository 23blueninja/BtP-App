name: QA

# The quick suite runs on every push while a change is being worked on; the full
# suite (every test at full size + the browser smoke test) runs on pull requests,
# so it has passed before a merge (PM 2026-10-31).
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  qa:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:qa

  full:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:all
